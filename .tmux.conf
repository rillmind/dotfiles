# ~/.tmux.conf

set-option -g default-shell "/bin/zsh"

# Desativa o prefixo padrão
unbind C-b
unbind C-r
set-option -g prefix None

# Teclas estendidas: sem isto o Ctrl+1..9 não chega ao tmux (ver abas, abaixo) nem aos apps.
# O Ghostty (xterm-ghostty) precisa declarar o suporte; o formato csi-u é o que o nvim entende melhor.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm-ghostty:extkeys'

# Mouse e índices
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# --- NAVEGAÇÃO ENTRE JANELAS (ABAS) ---

bind -n C-t new-window

bind -n C-q kill-window

bind -n S-Left  previous-window
bind -n S-Right next-window

bind -n C-h previous-window
bind -n C-l next-window

# Ctrl+número vai direto para a aba (as abas são renumeradas, sem buracos)
bind -n C-1 select-window -t :1
bind -n C-2 select-window -t :2
bind -n C-3 select-window -t :3
bind -n C-4 select-window -t :4
bind -n C-5 select-window -t :5
bind -n C-6 select-window -t :6
bind -n C-7 select-window -t :7
bind -n C-8 select-window -t :8
bind -n C-9 select-window -t :9

# --- NAVEGAÇÃO ENTRE PAINÉIS (Divididos na mesma tela) ---

bind -n C-M-h select-pane -L
bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R

# Dividir painéis (no mesmo diretório)
bind -n C-u split-window -h -c '#{pane_current_path}'
bind -n C-i split-window -v -l 30% -c '#{pane_current_path}'

# Zoom
bind -n C-z resize-pane -Z

# --- Modo Vim no Copy Mode ---
setw -g mode-keys vi

# Entrar no copy-mode sem precisar de prefixo (já que prefix é None)
bind -n C-v copy-mode

# Dentro do copy-mode, usar binds estilo vim
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send-keys -X cancel

# Busca (já vem quase pronta com mode-keys vi, mas deixando explícito)
bind -T copy-mode-vi / send-keys -X search-forward
bind -T copy-mode-vi ? send-keys -X search-backward

# Ctrl+Shift+V com imagem no clipboard: cola no Claude Code (o Ghostty envia CSI 9999~)
set -s user-keys[0] "\e[9999~"
bind -n User0 run-shell -b "~/.scripts/linux/tmux-paste-image.sh '#{pane_id}'"

# Colar o que foi copiado no tmux (buffer interno)
# bind -n C-p paste-buffer

# --- MOVER JANELAS (REORDENAR ABAS) ---

# Mover aba atual para a Esquerda (Ctrl + Shift + Esquerda)
bind -n C-S-h swap-window -t -1 \; select-window -t -1

# Mover aba atual para a Direita (Ctrl + Shift + Direita)
bind -n C-S-l swap-window -t +1 \; select-window -t +1

# # Yazi
# bind -n C-M-e run-shell "~/.local/bin/tmux-yazi-toggle"

# --- Catppuccin / Visual ---
# em arquivo próprio para o tema do quickshell recarregar só esta parte (ver ~/.config/quickshell/aparencia.sh)
source-file ~/.config/tmux/visual.conf

# Ctrl+Shift+B troca entre a barra lateral e a do topo (a escolha fica guardada)
# (b e B: o Ghostty manda a letra maiúscula quando há Shift, e o tmux diferencia as duas)
bind -n C-S-b run-shell -b "~/.config/tmux/lateral.py alternar"
bind -n C-S-B run-shell -b "~/.config/tmux/lateral.py alternar"
bind -n C-B run-shell -b "~/.config/tmux/lateral.py alternar"
run-shell -b "~/.config/tmux/lateral.py inicio"
