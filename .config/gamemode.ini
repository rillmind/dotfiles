; Complementa o /usr/share/gamemode/gamemode.ini (governor performance, split lock etc.).
; O usuário precisa estar no grupo gamemode para esses ajustes do sistema serem permitidos.

[custom]
; perfil de energia "desempenho" enquanto um jogo está aberto (tuned-ppd; não há powerprofilesctl)
start=busctl --system set-property org.freedesktop.UPower.PowerProfiles /org/freedesktop/UPower/PowerProfiles org.freedesktop.UPower.PowerProfiles ActiveProfile s performance
end=busctl --system set-property org.freedesktop.UPower.PowerProfiles /org/freedesktop/UPower/PowerProfiles org.freedesktop.UPower.PowerProfiles ActiveProfile s balanced
