theme = "catppuccin_mocha"

[editor]
true-color = true

[editor.file-picker]
hidden = false

[keys.normal]
"G" = "goto_file_end"
"C-s" = [":w", ":format"]
"A-e" = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/unique-file',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]
"C-A-e" = "buffer_picker"
"C-A-s" = ":wa"
"0" = "goto_line_start"
"$" = "goto_line_end"
"A-j" = "move_line_down"
"V" = ["select_mode", "extend_line"]
"esc" = ["keep_primary_selection", "collapse_selection"]
"C-r" = "redo"
"C-A-k" = "move_line_up"
"," = "collapse_selection"
"s" = "change_selection"
"x" = "delete_selection"
"d" = "delete_selection"

[keys.normal.space]
"w" = [":w", ":format"]
"a" = ":wa"
"q" = ":q!"
"l" = "goto_next_buffer"
"h" = "goto_previous_buffer"

[keys.insert]
"C-A-j" = "move_line_down"
"A-k" = "move_line_up"
"C-tab" = "goto_next_buffer"
"C-S-tab" = "goto_previous_buffer"

[keys.select]
"s" = "change_selection"
"0" = "goto_line_start"
"$" = "goto_line_end"
"esc" = ["keep_primary_selection", "collapse_selection", "normal_mode"]
"Y" = "yank_main_selection_to_clipboard"
"x" = "delete_selection"
"d" = "delete_selection"
"G" = "goto_file_end"
