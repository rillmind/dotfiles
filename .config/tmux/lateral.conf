# Barra lateral esquerda (ver lateral.py). Liga:     tmux source-file ~/.config/tmux/lateral.conf
#                                         Desliga:  ~/.config/tmux/lateral.py desligar
# divisória: fundo do terminal, para a barra ter a mesma margem dos dois lados; com mais de um painel, volta a marcar o ativo
set -g pane-border-style "fg=#{?#{e|>:#{window_panes},2},#{@thm_surface_1},#{@thm_bg}},bg=default"
set -g pane-active-border-style "fg=#{?#{e|>:#{window_panes},2},#{@thm_mauve},#{@thm_bg}},bg=default"

# mouse na barra: clique troca de aba, roda passa as abas, sem seleção nem foco
bind -n MouseDown1Pane { if-shell -F -t = "#{@barra}" { run-shell -b "~/.config/tmux/lateral.py clique #{mouse_y} '#{session_id}'" } { select-pane -t = ; send-keys -M } }
bind -n MouseDrag1Pane { if-shell -F -t = "#{@barra}" { } { if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M } } }
bind -n WheelUpPane { if-shell -F -t = "#{@barra}" { previous-window } { if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e } } }
bind -n WheelDownPane { if-shell -F -t = "#{@barra}" { next-window } { send-keys -M } }
run-shell "~/.config/tmux/lateral.py ligar"
