# Visual do tmux: plugin catppuccin com as cores do tema do quickshell (Catppuccin Mocha ou Gruvbox
# escuro/claro). tema-ativo.conf → ~/.local/state/quickshell/aparencia/tmux.conf → temas/<paleta>.conf.
# O aparencia.sh limpa as opções do plugin e relê este arquivo nas sessões abertas.
source-file -q ~/.config/tmux/tema-ativo.conf
set -g @catppuccin_window_status_style "rounded"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Abas: número num quadrado de cantos arredondados + título com fundo; na direita, o servidor (ícone e nome
# da sessão). As bordas são da fonte Tmux Cantos (fonte/gerar.py), ligada no config do Ghostty.
# @cantos (redondos | retos) vem do tema.
# Vem depois do plugin, que define os formatos dele.
set -g status-position top
set -g status-left ""
set -g status-style "bg=#{@thm_mantle},fg=#{@thm_fg}"
set -g window-status-separator " "
set -g window-status-style "default"
set -g window-status-current-style "default"
set -g window-status-last-style "default"
set -g window-status-activity-style "default"
set -g window-status-bell-style "default"
set -g window-status-format "#[fg=#{?window_bell_flag,#{@thm_red},#{?window_activity_flag,#{@thm_yellow},#{@thm_surface_1}}},bg=#{@thm_mantle}]#{?#{==:#{@cantos},retos},▐,}#[fg=#{@thm_fg},bg=#{?window_bell_flag,#{@thm_red},#{?window_activity_flag,#{@thm_yellow},#{@thm_surface_1}}}]#I#[nobold,fg=#{?window_bell_flag,#{@thm_red},#{?window_activity_flag,#{@thm_yellow},#{@thm_surface_1}}},bg=#{@thm_bg}]#{?#{==:#{@cantos},retos},▌,}#[fg=#{@thm_overlay_2},bg=#{@thm_bg}]#{=/30/…:pane_title}#[fg=#{@thm_bg},bg=#{@thm_mantle}]#{?#{==:#{@cantos},retos},▌,}"
set -g window-status-current-format "#[fg=#{@thm_mauve},bg=#{@thm_mantle}]#{?#{==:#{@cantos},retos},▐,}#[fg=#{@thm_mantle},bold,bg=#{@thm_mauve}]#I#[nobold,fg=#{@thm_mauve},bg=#{@thm_surface_0}]#{?#{==:#{@cantos},retos},▌,}#[fg=#{@thm_fg},bg=#{@thm_surface_0}]#{=/30/…:pane_title}#[fg=#{@thm_surface_0},bg=#{@thm_mantle}]#{?#{==:#{@cantos},retos},▌,}"
set -g status-right "#[fg=#{@thm_green},bg=#{@thm_mantle}]#{?#{==:#{@cantos},retos},▐,}#[fg=#{@thm_mantle},bold,bg=#{@thm_green}]  #S#[fg=#{@thm_green},bg=#{@thm_mantle}]#{?#{==:#{@cantos},retos},▌,}"
set -g status-right-length 40

# barra lateral ligada: refaz com as cores novas (ver lateral.conf)
if-shell -F "#{@lateral}" { source-file ~/.config/tmux/lateral.conf }
