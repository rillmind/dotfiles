# Visual do tmux: plugin catppuccin com as cores do tema do quickshell (Catppuccin Mocha ou Gruvbox
# escuro/claro). tema-ativo.conf → ~/.local/state/quickshell/aparencia/tmux.conf → temas/<paleta>.conf.
# O aparencia.sh limpa as opções do plugin e relê este arquivo nas sessões abertas.
source-file -q ~/.config/tmux/tema-ativo.conf
set -g @catppuccin_window_status_style "rounded"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Barra só com ícones: um quadrado numerado por aba (de 10 em diante, só o número) e, na direita, o
# ícone do servidor. Sem títulos. Vem depois do plugin, que define os formatos com texto.
set -g status-position top
set -g status-left " "
set -g status-left-length 10
set -g status-style "bg=#{@thm_mantle},fg=#{@thm_fg}"
set -g @aba "#{?#{==:#{window_index},1},󰎤,#{?#{==:#{window_index},2},󰎧,#{?#{==:#{window_index},3},󰎪,#{?#{==:#{window_index},4},󰎭,#{?#{==:#{window_index},5},󰎱,#{?#{==:#{window_index},6},󰎳,#{?#{==:#{window_index},7},󰎶,#{?#{==:#{window_index},8},󰎹,#{?#{==:#{window_index},9},󰎼,#{window_index}}}}}}}}}}"
set -g window-status-separator " "
set -g window-status-style "fg=#{@thm_surface_2}"
set -g window-status-last-style "default"
set -g window-status-activity-style "fg=#{@thm_yellow}"
set -g window-status-bell-style "fg=#{@thm_red}"
set -g window-status-current-style "fg=#{@thm_mauve}"
set -g window-status-format "#{E:@aba} "
set -g window-status-current-format "#{E:@aba} "
set -g status-right "#[fg=#{@thm_green}]󰆍  "
set -g status-right-length 10
