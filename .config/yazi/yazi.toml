[mgr]
ratio = [1, 2, 2]
show_hidden = true
sort_dir_first = true

[[opener.edit]]
run = 'hx "$@"'
block = true
desc = "Edit"
for = "unix"

[[plugin.prepend_fetchers]]
id = "git"
url = "*"
run = "git"
group = "hover"
name = "init.lua"

[[plugin.prepend_fetchers]]
id = "git"
url = "*/"
run = "git"
group = "hover"
name = "init.lua"
