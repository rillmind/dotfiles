# Hyprland mínimo com o tema Vinho do quickshell para versões sem config em Lua. Igual ao hyprland.lua desta pasta.
$tema = ~/.config/quickshell/tema.sh
$mainMod = ALT

monitor = , preferred, auto, 1

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = $tema iniciar

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2
    layout = dwindle
    col.active_border = rgb(8c2f4b)
    col.inactive_border = rgb(35151f)
}
decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}
animations {
    enabled = false
}
misc {
    background_color = rgb(15070d)
    disable_hyprland_logo = true
    disable_splash_rendering = true
    allow_session_lock_restore = true
}
input {
    kb_layout = br,us
    kb_options = grp:win_space_toggle
    numlock_by_default = true
    accel_profile = flat
    sensitivity = 0.1
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# programas
bind = $mainMod, Return, exec, ghostty --config-file=$HOME/.config/vinho/ghostty.conf
bind = $mainMod, space, exec, $tema ipc launcher toggle
bind = SUPER, A, exec, $tema ipc launcher toggle
bind = $mainMod, B, exec, $tema ipc launcher power
bind = SUPER, U, exec, ~/.config/quickshell-bloqueio/bloquear.sh
bind = SUPER, E, exec, nautilus
bind = SUPER SHIFT, S, exec, grim -g "$(slurp -d)" - | wl-copy

# janelas
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod SHIFT, M, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, P, pseudo
bind = $mainMod, Tab, cyclenext
bind = $mainMod SHIFT, Tab, cyclenext, prev
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = $mainMod, H, movefocus, l
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod, L, movefocus, r
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod, K, movefocus, u
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod, J, movefocus, d
bind = $mainMod SHIFT, J, movewindow, d

# workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, A, movetoworkspace, special:special
bind = $mainMod, minus, togglespecialworkspace, special
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod CTRL, left, workspace, e-1
bind = $mainMod CTRL, right, workspace, e+1

# redimensionar (borda dourada enquanto ativo)
bind = $mainMod, R, exec, hyprctl keyword general:col.active_border "rgb(d9a862)"
bind = $mainMod, R, submap, resize
submap = resize
binde = , l, resizeactive, 10 0
binde = , h, resizeactive, -10 0
binde = , k, resizeactive, 0 -10
binde = , j, resizeactive, 0 10
bind = , escape, exec, hyprctl keyword general:col.active_border "rgb(8c2f4b)"
bind = , escape, submap, reset
submap = reset

# brilho e volume
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
